<text x="34" y="48" font-size="32" fill="#edf4ee" font-weight="600" letter-spacing="-.7">Du entscheidest über den Zugriff.</text>
<text x="35" y="78" font-size="15" fill="#96a9af" >Funktionsweise · 16-Sekunden-Beispiel, keine Live-Sitzung</text>
<path d="M34 103H1166" stroke="#2a3a42"/>
<rect x="34" y="130" width="320" height="266" fill="#101c25" stroke="#334b54"/>
<text x="54" y="161" font-size="14" fill="#91f4d1" class="mono">01</text>
<text x="96" y="161" font-size="15" fill="#c6d8d8" class="mono" font-weight="700">DEIN COMPUTER</text>
<text x="54" y="351" font-size="16" fill="#bccbce" >Lies die Zugriffserklärung.</text>
<text x="54" y="375" font-size="16" fill="#bccbce" >Akzeptiere oder lehne ab.</text>
<rect x="440" y="130" width="320" height="266" fill="#101c25" stroke="#334b54"/>
<text x="460" y="161" font-size="14" fill="#91f4d1" class="mono">02</text>
<text x="502" y="161" font-size="15" fill="#c6d8d8" class="mono" font-weight="700">REGISTRIERUNG</text>
<text x="460" y="351" font-size="16" fill="#bccbce" >Nur HTTPS-Registrierung.</text>
<text x="460" y="375" font-size="16" fill="#bccbce" >Geräteschlüssel entstehen automatisch.</text>
<rect x="846" y="130" width="320" height="266" fill="#101c25" stroke="#334b54"/>
<text x="866" y="161" font-size="14" fill="#91f4d1" class="mono">03</text>
<text x="908" y="161" font-size="15" fill="#c6d8d8" class="mono" font-weight="700">BETREIBER-ZENTRALE</text>
<text x="866" y="351" font-size="16" fill="#bccbce" >Ein freigegebenes Gerät ansehen.</text>
<text x="866" y="375" font-size="16" fill="#bccbce" >Das Dashboard bleibt privat.</text>
